# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# A Blueprint service with the same name as an existing service updates that service.
services:
  - type: web
    name: actionpulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # FastAPI is ASGI: Render's default `gunicorn your_application.wsgi` is a placeholder
    # and gunicorn isn't installed, so the service exits with status 127.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # New Render services default to Python 3.14; CI tests on 3.11.
      - key: PYTHON_VERSION
        value: 3.11.16
      # Invite/email links and CORS.
      - key: FRONTEND_URL
        value: https://ai-powered-meeting-to-action-conver.vercel.app
      # Secrets: Render asks for these when the Blueprint is first applied.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # GitHub App receiver runs in this FastAPI service, with Supabase for persistence.
      # Webhook URL: https://ai-powered-meeting-to-action-converter-9k2z.onrender.com/api/github/webhook
      # Existing Render services must also set these in their Environment settings.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://ai-powered-meeting-to-action-conver.vercel.app/github/callback
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-lite-v1:0
      - key: LLM_PROVIDER_ALLOWLIST
        value: bedrock,gemini
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INTERNAL_TICK_SECRET
        sync: false
      # Offline-meeting diarization worker (diarization-worker/, free HF Space)
      - key: DIARIZATION_WORKER_URL
        sync: false
      - key: DIARIZATION_WORKER_SECRET
        sync: false
