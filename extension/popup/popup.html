<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ActionPulse</title>
  <link rel="stylesheet" href="../shared/panel.css" />
  <link rel="stylesheet" href="popup.css" />
  <script src="../shared/meeting.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="panel-header toolbar">
    <img class="brand-icon" src="../icons/icon-48.png" alt="" />
    <h1 class="brand-name">ActionPulse</h1>
    <button class="secondary" id="openApp" type="button">Open ActionPulse <span aria-hidden="true">↗</span></button>
  </header>
  <main>
    <section aria-label="Account" class="account">
      <span class="account-indicator" aria-hidden="true"></span>
      <span id="account" role="status">Checking account…</span>
    </section>
    <button class="primary" type="button" id="showOffer" hidden>Show meeting prompt</button>
    <section id="captures" aria-label="Meeting captures"></section>
    <details class="settings" id="settings">
      <summary>Connection settings</summary>
      <form id="connection">
        <label class="field-label">ActionPulse website <input name="appUrl" type="url" required spellcheck="false" /></label>
        <label class="field-label">Backend API URL <input name="apiUrl" type="url" required spellcheck="false" /></label>
        <div class="actions">
          <button class="secondary" id="defaults" type="button">Use deployed defaults</button>
          <button class="primary" type="submit">Save</button>
        </div>
        <p class="muted" role="status" id="settingsStatus"></p>
      </form>
    </details>
    <p class="error" role="alert" id="error"></p>
  </main>
</body>
</html>
