name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Run Migrations on Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: env.SUPABASE_DB_URL != '' || env.SUPABASE_DB_PASSWORD != ''
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase migration repair --status applied --db-url "$SUPABASE_DB_URL" --yes 0001 0002 0003 0004 0005 || true
            supabase db push --remote "$SUPABASE_DB_URL" --yes
          else
            supabase link --project-ref "$PROJECT_REF"
            supabase migration repair --status applied --yes 0001 0002 0003 0004 0005 || true
            supabase db push --yes
          fi
        env:
          PROJECT_REF: jdzwrpdkqlsnrnluuwjg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
